services:
  - type: web
    name: nclex-backend
    env: python
    plan: free
    branch: production-ready
    buildCommand: "cd backend && ./build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        sync: false
      
      # Database
      - key: DATABASE_URL
        sync: false
      
      # Python version
      - key: PYTHON_VERSION
        value: 3.11.0
      
      # Debug
      - key: DEBUG
        value: "False"
      
      # JWT
      - key: JWT_SECRET_KEY
        sync: false
      
      # Site URL
      - key: SITE_URL
        value: "https://nclex-backend.onrender.com"
      
      # Email Settings
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "NCLEX <noreply@nclex.com>"
      
      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      
      # Frontend URL
      - key: FRONTEND_URL
        value: "https://nclex-beryl.vercel.app"
      
      # CORS Settings (for production)
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nclex-beryl.vercel.app"
      
      # Bank Details
      - key: BANK_ACCOUNT_NAME
        value: "NCLEX KEYS"
      - key: BANK_ACCOUNT_NUMBER
        value: "28146"
      - key: BANK_NAME
        value: "First Bank of Nigeria"
      
      # Payment Gateways
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_SPLIT_CODE
        value: ""
      - key: PAYSTACK_SUBACCOUNT_CODE
        value: ""
      
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_ENCRYPTION_KEY
        sync: false
      
      # Celery (use memory for free tier)
      - key: CELERY_BROKER_URL
        value: "memory://"
      - key: CELERY_RESULT_BACKEND
        value: "rpc://"
      
      # Security Settings
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"